name: V5 Bank Format Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect GitHub-hosted V5 bank format
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _probe
          gh release download radiology1405-apk-v1.2.0-20260812 -p radiology1405_android_project_v1.2.0.zip -D _probe
          unzip -q _probe/radiology1405_android_project_v1.2.0.zip -d _probe/v12
          V5BIN="$(find _probe/v12 -type f -name '*bank_v5.bin' -print -quit)"
          test -n "$V5BIN"
          echo "V5BIN=$V5BIN"
          ls -l "$V5BIN"
          sha256sum "$V5BIN"
          file "$V5BIN"
          xxd -l 96 "$V5BIN"
          echo '--- BankDb.kt ---'
          cat "$(find _probe/v12 -type f -name BankDb.kt -print -quit)"
          echo '--- verify_bank.py ---'
          cat "$(find _probe/v12 -type f -path '*/tests/verify_bank.py' -print -quit)"
          echo '--- MainActivity bank references ---'
          grep -RniE 'bank_v5|BankDb|Inflater|GZIP|Deflater|decode|rawResource|SQLite' _probe/v12/app/src/main/java || true

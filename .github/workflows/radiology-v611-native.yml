name: V6.1 Direct Asset Probe

on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe direct V6.1 Drive assets
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, pathlib, hashlib, sys
          ids={
            'bank_gz':'1r8IvfWT7R_ihzfLC6QyoGQNQiDFrvhZZ',
            'bank_json':'1D07Qbp2iPOwfmksy09kdyjSc3hWHiq03',
            'all_outputs':'1nBXmgZAzFLqEYJ9mBvFwBBBlQqrLs33E',
            'android_project':'14RbsAhiS1Cj3Y_JgPfR0pf1rmeXgxJUc',
          }
          for name,fid in ids.items():
              url=f'https://drive.usercontent.google.com/download?id={fid}&export=download&confirm=t'
              out=pathlib.Path(f'_probe_{name}.bin')
              try:
                  urllib.request.urlretrieve(url,out)
                  b=out.read_bytes()
                  print(name,'SIZE',len(b),'SHA',hashlib.sha256(b).hexdigest(),'HEAD',b[:24])
              except Exception as e:
                  print(name,'ERROR',type(e).__name__,str(e))
          PY

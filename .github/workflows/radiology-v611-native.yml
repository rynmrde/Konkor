name: V6.1 Source PDF Probe

on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public source PDFs needed by V6.1 crop regeneration
        run: |
          set -euo pipefail
          mkdir -p _probe
          python - <<'PY'
          import urllib.request,hashlib,pathlib
          files={
            '1RLMr0QK1qYDfLduSzIwV2U_3UbYUH8Gm':'6b080cda86b850cc61f040475fc4c03e7d62d11519f7f02ce1bf8cc1bc59edf8',
            '1rJU59jwXiEivi8N9hUdBlXfb3_7GyA7X':'ce7fc7fb03eba06a56f9abce0ffce9a0e88166ba1cd66f9e3d711b367c0a6b85',
          }
          for fid,expected in files.items():
              url=f'https://drive.usercontent.google.com/download?id={fid}&export=download&confirm=t'
              out=pathlib.Path('_probe')/f'{fid}.pdf'
              urllib.request.urlretrieve(url,out)
              b=out.read_bytes(); h=hashlib.sha256(b).hexdigest()
              print(fid,len(b),h,b[:8])
              assert h==expected,(fid,h,expected,len(b),b[:80])
          print('SOURCE_PDF_SHA_PASS')
          PY

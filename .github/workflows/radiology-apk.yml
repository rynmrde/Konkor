name: Radiology1405 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Android base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _src project
          gh release download radiology1405-build-input-20260811 \
            --repo "${{ github.repository }}" \
            --pattern 'radiology1405_android_project_v1.0.1.zip' \
            --dir _src
          unzip -q _src/radiology1405_android_project_v1.0.1.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Verify original V5 bank before packaging
        working-directory: project
        run: python3 tests/verify_bank.py

      - name: Apply V1.1 focus experience
        run: |
          python3 radiology_v110_patch/patch_v110.py project radiology_v110_patch
          mkdir -p project/app/src/main/res/raw
          cp project/app/src/main/assets/radiology1405_bank_v5.db.gz \
             project/app/src/main/res/raw/radiology1405_bank_v5.bin
          rm project/app/src/main/assets/radiology1405_bank_v5.db.gz
          test -s project/app/src/main/res/raw/radiology1405_bank_v5.bin

      - name: Validate V1.1 UI, schedule and JS
        working-directory: project
        run: |
          python3 tests/verify_ui_static.py
          python3 tests/verify_schedule.py
          python3 tests/verify_experience.py
          node --check app/src/main/assets/experience.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts=[x for x in re.findall(r'<script(?: [^>]*)?>(.*?)</script>',h,re.S) if "'use strict'" in x]
          assert scripts
          Path('/tmp/radiology-core.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/radiology-core.js

      - name: Apply V1.2 professional media system
        run: |
          sha256sum project/app/src/main/assets/index.html > /tmp/v120-index-before.sha256
          python3 radiology_v120_patch/patch_v120.py project radiology_v120_patch
          sha256sum -c /tmp/v120-index-before.sha256

      - name: Validate V1.2 professional assets and JS
        working-directory: project
        run: |
          python3 tests/verify_v120.py
          node --check app/src/main/assets/experience.js
          node --check app/src/main/assets/professional.js

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify packaged bank and experience layer
        run: |
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | tee /tmp/apk-contents.txt
          grep -q 'res/raw/radiology1405_bank_v5.bin' /tmp/apk-contents.txt
          grep -q 'assets/index.html' /tmp/apk-contents.txt
          grep -q 'assets/bank_index.json' /tmp/apk-contents.txt
          grep -q 'assets/experience.css' /tmp/apk-contents.txt
          grep -q 'assets/experience.js' /tmp/apk-contents.txt
          unzip -p "$APK" assets/experience.js | grep -q 'startFocusAudio'
          unzip -p "$APK" assets/experience.css | grep -q 'theme-oled'
          unzip -p "$APK" assets/experience.js | grep -q 'new Audio'
          python3 - <<'PY'
          import zipfile
          apk='project/app/build/outputs/apk/debug/app-debug.apk'
          z=zipfile.ZipFile(apk); names=set(z.namelist())
          icons=['home','dashboard','test','review','wrong','correct','blank','focus','adhd','themes','sound','music','haptics','settings','timer','progress','streak','bookmark','flag','next','previous','start','pause','resume','plan','calendar','mastery','analytics','export','import','close','check']
          illustrations=['round_complete','focus_complete','streak','empty_state','splash']
          sfx=['select','submit','correct','wrong','complete','focus_start','focus_end']
          focus=['ambient','rain','brown','pulse']
          req={f'assets/icons/{x}.svg' for x in icons}|{f'assets/illustrations/{x}.svg' for x in illustrations}|{f'assets/audio/sfx_{x}.wav' for x in sfx}|{f'assets/audio/focus_{x}.wav' for x in focus}|{'assets/professional.js','assets/professional.css'}
          miss=sorted(req-names)
          assert not miss, 'missing packaged V1.2 assets: '+str(miss)
          print('APK_V120_ASSET_VERIFY=PASS',len(req))
          PY
          echo 'APK_CONTENT_VERIFY=PASS'

      - name: Prepare release files
        run: |
          mkdir -p _out
          cp project/app/build/outputs/apk/debug/app-debug.apk _out/Radiology1405.apk
          sha256sum _out/Radiology1405.apk | tee _out/Radiology1405.apk.sha256
          (cd project && zip -qr ../_out/radiology1405_android_project_v1.2.0.zip . \
            -x 'app/build/*' '.gradle/*' 'build/*')
          sha256sum _out/radiology1405_android_project_v1.2.0.zip | tee _out/radiology1405_android_project_v1.2.0.zip.sha256

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radiology1405-v1.2.0
          path: |
            _out/Radiology1405.apk
            _out/Radiology1405.apk.sha256
          if-no-files-found: error

      - name: Publish APK and V1.2 source to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=radiology1405-apk-v1.2.0-20260812
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "${{ github.repository }}" --target "${GITHUB_SHA}" \
              --title 'Radiology1405 APK · V1.2 Professional' \
              --notes 'V1.2: custom icon system, illustrations, real offline SFX/focus audio, theme previews, splash/launcher polish, ADHD/reduced-motion compatibility. Core quiz engine protected by CI integrity checks.'
          gh release upload "$TAG" \
            _out/Radiology1405.apk \
            _out/Radiology1405.apk.sha256 \
            _out/radiology1405_android_project_v1.2.0.zip \
            _out/radiology1405_android_project_v1.2.0.zip.sha256 \
            --repo "${{ github.repository }}" \
            --clobber

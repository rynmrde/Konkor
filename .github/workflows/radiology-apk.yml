name: Radiology1405 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download validated Android project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _src project
          gh release download radiology1405-build-input-20260811 \
            --repo "${{ github.repository }}" \
            --pattern 'radiology1405_android_project_v1.0.1.zip' \
            --dir _src
          unzip -q _src/radiology1405_android_project_v1.0.1.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Verify bank, UI, and schedule
        working-directory: project
        run: |
          python3 tests/verify_bank.py
          python3 tests/verify_ui_static.py
          python3 tests/verify_schedule.py

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and name APK
        run: |
          test -s project/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p _out
          cp project/app/build/outputs/apk/debug/app-debug.apk _out/Radiology1405.apk
          sha256sum _out/Radiology1405.apk | tee _out/Radiology1405.apk.sha256

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload radiology1405-apk-20260811 \
            _out/Radiology1405.apk \
            _out/Radiology1405.apk.sha256 \
            --repo "${{ github.repository }}" \
            --clobber

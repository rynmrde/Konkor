name: Verify V6.1 Bootstrap Base

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download existing GitHub build input and hash semantics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _src _project
          gh release download radiology1405-build-input-20260811 \
            --repo "${{ github.repository }}" \
            --pattern 'radiology1405_android_project_v1.0.1.zip' \
            --dir _src
          unzip -q _src/radiology1405_android_project_v1.0.1.zip -d _project
          BANK="$(find _project -type f -name 'radiology1405_bank_v5.db.gz' -print -quit)"
          test -s "$BANK"
          echo "V5_GZ_SHA=$(sha256sum "$BANK" | awk '{print $1}')"
          python3 - "$BANK" <<'PY'
          import gzip,hashlib,sqlite3,sys,tempfile,os,pathlib
          src=sys.argv[1]
          fd,tmp=tempfile.mkstemp(suffix='.db'); os.close(fd)
          try:
              with gzip.open(src,'rb') as f, open(tmp,'wb') as o: o.write(f.read())
              data=pathlib.Path(tmp).read_bytes()
              print('V5_DB_SIZE='+str(len(data)))
              print('V5_DB_SHA='+hashlib.sha256(data).hexdigest())
              con=sqlite3.connect(tmp)
              qrows=con.execute('select id,full_json from question order by id').fetchall()
              h=hashlib.sha256()
              for qid,raw in qrows:
                  h.update(qid.encode()); h.update(b'\0'); h.update(raw.encode()); h.update(b'\n')
              print('Q_FULLJSON_HASH='+h.hexdigest())
              print('Q_COUNT='+str(len(qrows)))
              roots=con.execute('select key,json from bank_root order by key').fetchall()
              h2=hashlib.sha256()
              for k,raw in roots:
                  h2.update(k.encode()); h2.update(b'\0'); h2.update(raw.encode()); h2.update(b'\n')
              print('ROOT_HASH='+h2.hexdigest())
              print('ROOT_COUNT='+str(len(roots)))
              con.close()
          finally:
              try: os.unlink(tmp)
              except FileNotFoundError: pass
          PY

name: Verify V6.1 Bootstrap Base

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download existing GitHub build input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _src _project
          gh release download radiology1405-build-input-20260811 \
            --repo "${{ github.repository }}" \
            --pattern 'radiology1405_android_project_v1.0.1.zip' \
            --dir _src
          unzip -q _src/radiology1405_android_project_v1.0.1.zip -d _project
          BANK="$(find _project -type f -name 'radiology1405_bank_v5.db.gz' -print -quit)"
          test -s "$BANK"
          echo "V5_GZ_SHA=$(sha256sum "$BANK" | awk '{print $1}')"
          python3 - "$BANK" <<'PY'
          import gzip,hashlib,sys,tempfile,pathlib
          src=sys.argv[1]
          with gzip.open(src,'rb') as f: data=f.read()
          print('V5_DB_SIZE='+str(len(data)))
          print('V5_DB_SHA='+hashlib.sha256(data).hexdigest())
          PY
